# 로컬 개발용 PostgreSQL 16 (Docker 사용 시)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mes
    ports:
      - "5432:5432"
    volumes:
      - mes_pgdata:/var/lib/postgresql/data
      - ./scripts/docker_init_test_db.sh:/docker-entrypoint-initdb.d/10_test_db.sh:ro
volumes:
  mes_pgdata:
